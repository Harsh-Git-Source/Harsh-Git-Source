project:
  name: text-summarization-cnn-dailymail
  task: abstractive_text_summarization
  dataset: cnn_dailymail
  dataset_config: 3.0.0
  seed: 42

bilstm:
  train_samples: 50000
  validation_samples: 5000
  test_samples: 100
  article_max_length: 600
  summary_max_length: 150
  vocabulary_size: 50000
  min_frequency: 5
  embedding: glove.6B.300d
  hidden_size: 256
  batch_size: 16
  learning_rate: 0.0001
  epochs: 3
  teacher_forcing_ratio: 0.5
  beam_width: 5

flan_t5_lora:
  model_name: google/flan-t5-small
  train_samples: 50000
  validation_samples: 10000
  test_samples: 5000
  max_input_length: 600
  max_target_length: 150
  batch_size: 16
  learning_rate: 0.00005
  epochs: 5
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules: [q, v]
  beam_width: 4
